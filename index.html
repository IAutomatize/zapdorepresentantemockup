<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protótipos — Zap do Representante</title>
  <link rel="icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --fundo: #f4f7fb;
      --cartao: #ffffff;
      --texto: #1f2937;
      --suave: #6b7280;
      --borda: #e5e9f0;
      --primaria: #2196f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: var(--fundo); color: var(--texto);
      font-family: Inter, system-ui, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    header img { width: 44px; height: 44px; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .intro { margin: 0 0 32px; color: var(--suave); line-height: 1.55; }
    .lista { display: grid; gap: 12px; }
    .item {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 20px; border-radius: 14px;
      background: var(--cartao); border: 1px solid var(--borda);
      color: inherit; text-decoration: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .item:hover { border-color: var(--primaria); box-shadow: 0 6px 20px rgba(33, 150, 243, .12); }
    .icone {
      flex: none; width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center;
      background: rgba(33, 150, 243, .1); color: var(--primaria); font-size: 22px;
    }
    .item h2 { margin: 0 0 3px; font-size: 16px; font-weight: 600; }
    .item p { margin: 0; color: var(--suave); font-size: 14px; }
    .item .seta { margin-left: auto; color: var(--suave); font-size: 20px; }
    footer { margin-top: 40px; color: var(--suave); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="logo.png" alt="">
      <h1>Protótipos para aprovação</h1>
    </header>
    <p class="intro">
      Telas de demonstração do Zap do Representante. Funcionam no navegador, mas nada aqui é
      salvo nem enviado, e todos os contatos e conversas são fictícios.
    </p>

    <div class="lista">
      <a class="item" href="chats.html">
        <span class="icone"><i class="ri-chat-3-line"></i></span>
        <span>
          <h2>Conversas</h2>
          <p>Tela de atendimento como está hoje no sistema.</p>
        </span>
        <i class="ri-arrow-right-s-line seta"></i>
      </a>
    </div>

    <footer>Abra no computador ou no celular.</footer>
  </main>
</body>
</html>
